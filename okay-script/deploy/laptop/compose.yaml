# generated by okay-deploy from okay-script's Deployment value — edit the value, not this file
services:
  web:
    image: okay-script/web:local
    build:
      context: ../..
      dockerfile: okay-script/deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OKAY_PAGES: "/app/pages"
      OKAY_PORT: "8080"
      OKAY_OPS: "1"
    volumes:
      - web-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  web-data:
