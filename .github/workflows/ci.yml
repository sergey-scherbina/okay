name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test (JVM) and compile every platform and benchmark
        run: sbt okayJVM/test okayJS/compile okayNative/compile okayJVM/Jmh/compile compare/test compare/Jmh/compile
