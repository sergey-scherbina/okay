name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # the whole family, once a night, split by platform below. A push
    # pays for what it changed; this pays for everything, off the
    # push path where it cannot queue behind anyone
    - cron: "17 2 * * *"
  workflow_dispatch:

# ONE RUN PER REF. Without this every push to master queued another full
# suite and they piled up — 100 of them waiting when the account's Actions
# budget ran out. A superseded run tells nothing the newer one will not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# THE NUMBERS THAT SHAPED THIS FILE (2026-09-16, ci-affected). Every run
# in the visible history was cancelled by the next push — six minutes,
# twenty-two, ninety-nine, two at the six-hour limit — while the same
# `sbt test` takes two minutes warm on a developer's box. Two causes,
# two answers:
#   - every push compiled ninety-one modules from nothing: the target/
#     directories are cached below, restored from the NEAREST previous
#     key so zinc's incremental compile carries across pushes;
#   - every push tested the family regardless of what changed: a push
#     now runs `affected`, the projects its diff touches closed over
#     their dependents (project/Affected.scala), and the family runs
#     nightly, one job per platform.

jobs:
  affected:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # the diff needs history: the merge base with the branch for a
          # pull request, the previous pushed commit for a push
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Restore compiled classes from the nearest previous push
        uses: actions/cache@v4
        with:
          path: |
            **/target
            !**/target/streams
            project/target
            project/project/target
          key: targets-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-${{ github.sha }}
          restore-keys: |
            targets-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-
            targets-${{ runner.os }}-
      - name: What changed, and what depends on it
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # a push that created the branch has no `before`; the family then
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base to diff against: the whole family"
            sbt "family all"
          else
            echo "diff base: $BASE"
            sbt "affected $BASE"
          fi

  family:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/cache@v4
        with:
          path: |
            **/target
            !**/target/streams
            project/target
            project/project/target
          key: targets-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-${{ github.sha }}
          restore-keys: |
            targets-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-
            targets-${{ runner.os }}-
      - name: The whole family on one platform, and the benchmarks compiled
        run: |
          # gate.sh, not a bare sbt call (ci-native-flake): a lost test
          # process on Native is a known, false failure shape
          # (native-runner-error), and the nightly job was re-teaching
          # itself the same lesson gate.sh already knows how to answer —
          # its watchdog and rerun-alone logic apply to "family <platform>"
          # exactly as they do to "affected <ref>", since anything but
          # the "affected" form passes through gate.sh untouched.
          sh scripts/gate.sh "family ${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "jvm" ]; then sbt okayJVM/Jmh/compile compare/Jmh/compile; fi

  # OKAY2 (okay2-ci, 2026-09-24): the Scala 2.13 core is its OWN sbt
  # build (okay2/build.sbt), so neither job above can see it — `affected`
  # maps a diff onto the ROOT build's projects, and `family` runs only
  # those. Without this job okay2's tests ran only when a lane happened
  # to touch okay2/ and gated it by hand. Here: every push or pull
  # request whose diff touches okay2/ (or the gate script itself), and
  # the nightly/manual run always. The gate is the same script the lanes
  # use, run from okay2/, so it reads okay2's own .sdkmanrc; on a runner
  # without sdkman that pin is a no-op and setup-java's 21 is the JDK
  # (okay2-platform names virtual threads: 21+ at compile time).
  okay2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Restore okay2's compiled classes
        uses: actions/cache@v4
        with:
          path: |
            okay2/**/target
            !okay2/**/target/streams
            okay2/project/target
          key: okay2-targets-${{ runner.os }}-${{ hashFiles('okay2/build.sbt', 'okay2/project/**') }}-${{ github.sha }}
          restore-keys: |
            okay2-targets-${{ runner.os }}-${{ hashFiles('okay2/build.sbt', 'okay2/project/**') }}-
            okay2-targets-${{ runner.os }}-
      - name: Did this change touch okay2?
        id: touched
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base to diff against: run okay2"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD -- okay2 scripts/gate.sh | grep -q .; then
            echo "okay2/ changed since $BASE"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "okay2/ untouched since $BASE: nothing to run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The okay2 build, every module and test
        if: steps.touched.outputs.run == 'true'
        run: |
          cd okay2
          # the VERDICT LINE is the answer, not only the exit status: a
          # gate prints GREEN last, and anything else is not a pass
          sh ../scripts/gate.sh test | tee gate.out
          grep -q '^gate: GREEN' gate.out
