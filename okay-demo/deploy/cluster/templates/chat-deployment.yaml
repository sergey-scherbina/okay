{{- $v := index .Values "chat" -}}
# generated by okay-deploy — edit the Deployment value, not this file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: chat
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-chat
          volumeMounts:
            - name: data
              mountPath: "/app/data"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-chat-data
