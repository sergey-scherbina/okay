# DemoChat as the scaffold's first concrete instance (specs/deploy.md):
#   deploy/scripts/okay-package.sh okayDemo v1
#   helm install demo-chat deploy/helm/okay-app -f deploy/helm/okay-app/examples/demo-chat.values.yaml
image:
  repository: okay/demo
  tag: v1
service:
  port: 8090
env:
  - name: OKAY_CHAT_PORT
    value: "8090"
  - name: OKAY_CHAT_LOG
    value: ":memory:"      # a real deployment mounts a volume instead
