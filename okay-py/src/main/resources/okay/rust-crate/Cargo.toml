[package]
name = "okay"
version = "0.1.0"
edition = "2021"
description = "okay's programs-as-data and direct style for Rust: a worker on okay's wire (polyglot-one-wire)"
license = "Apache-2.0"
publish = false

[dependencies]
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# HMAC-SHA256 for the wire's auth (stage 5b): the digest only, HMAC is ten lines here
sha2 = { version = "0.10", default-features = false }
