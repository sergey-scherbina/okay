# generated by okay-deploy from demo-chat's Deployment value — edit the value, not this file
services:
  - type: web
    name: chat
    runtime: docker
    dockerfilePath: "./okay-demo/deploy/Dockerfile"
    dockerContext: .
    plan: starter
    healthCheckPath: "/readyz"
    envVars:
      - key: OKAY_CHAT_PORT
        value: "8090"
      - key: OKAY_CHAT_DB
        value: "/app/data/okay-board.log"
      - key: OKAY_CHAT_APP
        value: "/app/app.js"
      - key: PORT
        value: "8090"
    disk:
      name: data
      mountPath: "/app/data"
      sizeGB: 1
