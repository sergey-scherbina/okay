name: CI
on:
  push:
    branches: [master]
  pull_request:

# ONE RUN PER REF. Without this every push to master queued another full
# suite and they piled up — 100 of them waiting when the account's Actions
# budget ran out. A superseded run tells nothing the newer one will not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test the whole family (all platforms, all satellites) and compile the benchmarks
        run: sbt test okayJVM/Jmh/compile compare/Jmh/compile
