[package]
name = "okay"
version = "0.1.0"
edition = "2021"
description = "okay's programs-as-data and direct style for Rust: a worker on okay's wire (polyglot-one-wire)"
license = "Apache-2.0"
publish = false

[dependencies]
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# HMAC-SHA256 for the wire's auth (stage 5b): the digest only, HMAC is ten lines here
sha2 = { version = "0.10", default-features = false }
# TLS for serve_tcp (wire-tls), off unless asked for: rustls on ring, offline
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[features]
tls = ["dep:rustls", "dep:rustls-pki-types"]
