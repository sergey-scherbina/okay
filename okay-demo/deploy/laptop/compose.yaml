# generated by okay-deploy from demo-chat's Deployment value — edit the value, not this file
services:
  chat:
    image: demo-chat/chat:local
    build:
      context: ../..
      dockerfile: okay-demo/deploy/Dockerfile
    ports:
      - "8090:8090"
    environment:
      OKAY_CHAT_PORT: "8090"
      OKAY_CHAT_LOG: ":memory:"
      OKAY_CHAT_APP: "/app/app.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8090/healthz || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
