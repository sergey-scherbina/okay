# generated by okay-deploy from okay-script's Deployment value — edit the value, not this file
services:
  - type: web
    name: web
    runtime: docker
    dockerfilePath: "./okay-script/deploy/Dockerfile"
    dockerContext: .
    plan: starter
    healthCheckPath: "/healthz"
    envVars:
      - key: OKAY_PAGES
        value: "/app/pages"
      - key: OKAY_PORT
        value: "8080"
      - key: OKAY_OPS
        value: "1"
      - key: PORT
        value: "8080"
    disk:
      name: data
      mountPath: "/app/data"
      sizeGB: 1
